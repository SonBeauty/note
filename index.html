<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ tay học tập của Sơn</title>
<link rel="stylesheet" href="notebook-styles.css">
<link rel="stylesheet" href="notebook-content.css">
</head>
<body>
<div class="wrap">

  <header class="book">
    <h1>Sổ tay học tập</h1>
    <p>Tiếng Anh và lập trình, làm bài rồi chấm điểm ngay trong sổ</p>
  </header>

  <nav class="subject-tabs" id="subject-tabs"></nav>

  <div class="toolbar">
    <button id="btn-hide-vocab">Ẩn nghĩa (học thẻ)</button>
    <button id="btn-speed">Đọc chậm lại</button>
    <button id="btn-export">Xuất file backup</button>
    <button onclick="document.getElementById('file-import').click()">Nạp lại backup</button>
    <button onclick="window.print()">In ra giấy</button>
    <button id="btn-reset">Xóa hết làm lại</button>
    <input type="file" id="file-import" accept="application/json" hidden>
  </div>

  <div class="score-bar" id="book-top">
    <div class="label">
      <span id="score-text">0 / 0 câu đúng</span>
      <span id="score-pct">0%</span>
    </div>
    <div class="track"><div class="fill" id="score-fill"></div></div>
  </div>

  <button class="toc-fab" id="btn-toc" aria-label="Mở mục lục">☰ Mục lục</button>

  <div class="book-shell">
    <div class="sheet" id="sheet"></div>
    <nav class="bookmarks" id="bookmarks"></nav>
  </div>

  <div class="pager">
    <button id="btn-prev">‹ Trang trước</button>
    <span class="num" id="page-num">Trang 1 / 1</span>
    <button id="btn-next">Trang sau ›</button>
  </div>

</div>

<div class="drawer" id="drawer">
  <div class="drawer-panel">
    <div class="drawer-head">
      <b id="drawer-title">Mục lục</b>
      <button id="drawer-close" aria-label="Đóng mục lục">✕</button>
    </div>
    <nav class="bookmarks" id="drawer-list"></nav>
  </div>
</div>

<script src="data-chapters.js"></script>
<script src="data-vocabulary.js"></script>
<script src="data-exercises.js"></script>
<script src="data-sql-basics.js"></script>
<script src="data-sql-basics-exercises.js"></script>
<script src="data-sql-chapters.js"></script>
<script src="data-sql-exercises.js"></script>
<script src="data-mysql-chapters.js"></script>
<script src="data-mysql-exercises.js"></script>
<script src="data-security-chapters.js"></script>
<script src="data-security-exercises.js"></script>
<script src="data-transaction-chapters.js"></script>
<script src="data-transaction-exercises.js"></script>
<script src="data-algo-chapters.js"></script>
<script src="data-algo-exercises.js"></script>
<script src="data-js-chapters.js"></script>
<script src="data-js-exercises.js"></script>
<script src="data-subjects.js"></script>
<script src="notebook-state.js"></script>
<script src="notebook-speech.js"></script>
<script src="notebook-diff.js"></script>
<script src="notebook-blocks.js"></script>
<script src="notebook-render.js"></script>
<script src="notebook-app.js"></script>
<script src="notebook-toolbar.js"></script>
</body>
</html>
