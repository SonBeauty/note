<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ tay học tập của Sơn</title>
<style>
:root {
  /* Cambria/Constantia co bo glyph tieng Viet day du. Georgia thi khong, gay loi tach dau. */
  --serif: Cambria, Constantia, "Palatino Linotype", "Times New Roman", serif;
  --paper: #efe7d6; --sheet: #fffdf7; --paper-line: #e6ddc8; --margin-line: #d98d8d;
  --ink: #2c2a26; --ink-soft: #6b665c; --accent: #b4531f; --accent-soft: #f6e7da;
  --ok: #2f7a3f; --ok-bg: #e8f5ea; --warn: #a8730b; --warn-bg: #fbf1dc;
  --bad: #b03030; --bad-bg: #fbe8e8; --border: #d9d0bc; --shadow: rgba(90, 70, 40, .16);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #171613; --sheet: #23201c; --paper-line: #2e2a25; --margin-line: #6b3a3a;
    --ink: #ece6d9; --ink-soft: #a49b8c; --accent: #e08a4a; --accent-soft: #35291f;
    --ok: #7ecb8f; --ok-bg: #1d2c20; --warn: #e0b45a; --warn-bg: #2d2718;
    --bad: #e88b8b; --bad-bg: #2e1d1d; --border: #3b352d; --shadow: rgba(0, 0, 0, .45);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.7 var(--serif); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 18px 60px; }

header.book { text-align: center; padding: 30px 0 14px; }
header.book h1 { font-size: 30px; margin: 0 0 4px; }
header.book p { margin: 0; color: var(--ink-soft); font-style: italic; font-size: 15px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin: 14px 0 16px; }
button { font: inherit; font-size: 14px; cursor: pointer; padding: 6px 13px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--sheet); color: var(--ink); }
button:hover { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { opacity: .87; color: #fff; }
button:disabled { opacity: .35; cursor: default; }
button:disabled:hover { border-color: var(--border); color: var(--ink); }

/* ---- Cac tab chinh: Tieng Anh / SQL / Lap trinh ---- */
.subject-tabs { display: flex; gap: 8px; justify-content: center; margin: 6px 0 4px; }
.subject-tabs button { font-size: 16px; padding: 10px 22px; border-radius: 10px 10px 0 0;
  border-bottom-width: 3px; line-height: 1.2; }
.subject-tabs button small { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.subject-tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: bold; }
.subject-tabs button.on small { color: #fff; opacity: .8; }

/* ---- Nut mo muc luc, chi hien tren man hinh nho ---- */
.toc-fab { display: none; margin: 0 0 10px auto; }
.drawer { display: none; position: fixed; inset: 0; background: rgba(30, 22, 12, .45); z-index: 40; }
.drawer.open { display: block; }
.drawer-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(300px, 84vw);
  background: var(--sheet); border-left: 1px solid var(--border); padding: 14px;
  overflow-y: auto; box-shadow: -6px 0 24px var(--shadow); animation: slide-in .2s ease; }
@keyframes slide-in { from { transform: translateX(100%); } to { transform: none; } }
.drawer-head { display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; }
.drawer-head b { font-size: 17px; color: var(--accent); }
.drawer-head button { border: 0; background: none; font-size: 19px; padding: 2px 8px; }
.drawer .bookmarks { position: static; width: 100%; flex-direction: column; }

.score-bar { background: var(--sheet); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px; margin-bottom: 18px; }
.score-bar .label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 7px; }
.track { height: 9px; background: var(--paper-line); border-radius: 999px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }

/* ---- Cuon so: to giay + tab bookmark ben canh ---- */
.book-shell { display: flex; gap: 14px; align-items: flex-start; }
.sheet { flex: 1; min-width: 0; background: var(--sheet); border: 1px solid var(--border);
  border-radius: 4px 12px 12px 4px; box-shadow: 0 3px 14px var(--shadow); min-height: 62vh;
  padding: 26px 30px 30px 34px; position: relative; }
.sheet::before { content: ""; position: absolute; left: 16px; top: 0; bottom: 0;
  width: 1px; background: var(--margin-line); opacity: .55; }
.sheet.flip { animation: flip-in .28s ease; }
@keyframes flip-in { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

.bookmarks { display: flex; flex-direction: column; gap: 6px; width: 148px; flex: none;
  position: sticky; top: 14px; }
.bookmarks button { text-align: left; border-radius: 0 8px 8px 0; border-left: 5px solid var(--border);
  padding: 9px 11px; line-height: 1.35; }
.bookmarks button .bm-title { display: block; }
.bookmarks button .bm-sub { display: block; font-size: 12px; color: var(--ink-soft); }
.bookmarks button.on { border-left-color: var(--accent); background: var(--accent-soft);
  color: var(--accent); font-weight: bold; }
.bookmarks button.on .bm-sub { color: var(--accent); }

.page-head { display: flex; justify-content: space-between; align-items: baseline;
  gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 16px; }
.page-head h2 { font-size: 23px; margin: 0; }
.page-head .kicker { font-size: 13px; color: var(--ink-soft); font-style: italic; }
.tabs { display: flex; gap: 6px; margin-bottom: 18px; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px;
  margin-top: 26px; padding-top: 14px; border-top: 1px dashed var(--border); }
.pager .num { font-size: 14px; color: var(--ink-soft); }

h3.sub { font-size: 16px; color: var(--accent); border-bottom: 1px solid var(--border);
  padding-bottom: 5px; margin: 24px 0 12px; }
.intro { color: var(--ink-soft); margin: 0 0 18px; }
.card { background: var(--paper); border: 1px solid var(--border); border-radius: 8px;
  padding: 13px 15px; margin-bottom: 12px; }
.line-wrong, .line-right, .line-native { margin: 5px 0; }
.line-wrong { color: var(--bad); }
.line-right { color: var(--ok); font-weight: bold; }
.line-native { color: var(--accent); }
.tag { font-size: 12px; font-weight: bold; margin-right: 7px; opacity: .75; }

.rule { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 14px;
  border-bottom: 1px dashed var(--border); padding: 9px 0; }
.rule:last-child { border-bottom: 0; }
.rule .r-wrong { color: var(--bad); }
.rule .r-right { color: var(--ok); font-weight: bold; }
.rule .r-note { grid-column: 1 / -1; font-size: 14px; color: var(--ink-soft); }

/* Nut loa doc mau */
button.say { border: 0; background: none; padding: 0 4px; margin-left: 5px; font-size: 15px;
  line-height: 1; cursor: pointer; opacity: .45; vertical-align: baseline; }
button.say:hover { opacity: 1; transform: scale(1.15); }
button.say:active { transform: scale(.92); }

table.vocab { width: 100%; border-collapse: collapse; }
table.vocab td { padding: 7px 9px; border-bottom: 1px dashed var(--border); }
table.vocab td.en { font-weight: bold; width: 45%; }
table.vocab td.vi { color: var(--ink-soft); cursor: pointer; }
table.vocab td.vi.hidden { color: transparent; background: var(--paper-line); border-radius: 4px; }

.ex { background: var(--paper); border: 1px solid var(--border); border-left: 4px solid var(--border);
  border-radius: 8px; padding: 13px 15px; margin-bottom: 13px; }
.ex.correct { border-left-color: var(--ok); background: var(--ok-bg); }
.ex.close { border-left-color: var(--warn); background: var(--warn-bg); }
.ex.wrong { border-left-color: var(--bad); background: var(--bad-bg); }
.ex .kind { font-size: 13px; color: var(--ink-soft); font-style: italic; }
.ex .prompt-vi { font-size: 17px; margin-top: 2px; }
.ex .prompt-vi b { color: var(--accent); margin-right: 5px; }
.ex input.answer { width: 100%; font: inherit; font-size: 15px; padding: 9px 11px; margin: 9px 0;
  border: 1px solid var(--border); border-radius: 6px; background: var(--sheet); color: var(--ink); }
.ex input.answer:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.ex .actions { display: flex; gap: 7px; flex-wrap: wrap; }
.ex .feedback { margin-top: 9px; font-size: 15px; display: none; }
.ex .feedback.show { display: block; }
.fb-ok { color: var(--ok); font-weight: bold; }
.fb-warn { color: var(--warn); font-weight: bold; }
.fb-bad { color: var(--bad); font-weight: bold; }
.solution { margin-top: 5px; color: var(--ok); }

/* Danh dau tung tu sai trong cau nguoi hoc viet */
.diff { margin: 8px 0 6px; padding: 9px 12px; background: var(--sheet);
  border: 1px solid var(--border); border-radius: 7px; line-height: 2; }
.d-case { color: var(--warn); border-bottom: 2px dotted var(--warn); }
.d-wrong { color: var(--bad); border-bottom: 2px solid var(--bad); }
.d-extra { color: var(--bad); text-decoration: line-through; opacity: .75; }
.d-gap { color: var(--bad); font-weight: bold; cursor: help; }
ul.diff-notes { margin: 4px 0 0; padding-left: 20px; font-size: 14.5px; color: var(--ink-soft); }
ul.diff-notes li { margin: 2px 0; }

textarea.notes { width: 100%; min-height: 120px; font: inherit; font-size: 15px; padding: 11px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--paper); color: var(--ink); resize: vertical; }
.saved-hint { font-size: 13px; color: var(--ink-soft); margin-top: 5px; }

ol.contents { padding-left: 20px; margin: 0; }
ol.contents li { padding: 9px 0; border-bottom: 1px dashed var(--border); cursor: pointer; }
ol.contents li:hover { color: var(--accent); }
ol.contents li .c-sub { font-size: 14px; color: var(--ink-soft); }
ol.contents li .c-score { float: right; font-size: 14px; color: var(--ink-soft); }

/* Man hinh nho: bo cot bookmark ben canh, thay bang nut Muc luc mo ngan keo */
@media (max-width: 800px) {
  .book-shell > .bookmarks { display: none; }
  .toc-fab { display: block; }
  .sheet { padding: 20px 16px 24px 22px; }
  .rule { grid-template-columns: 1fr; }
  .subject-tabs { gap: 5px; }
  .subject-tabs button { flex: 1; padding: 9px 4px; font-size: 14px; }
}

/* ---- Dien thoai: chu to hon, nut de bam, thanh lat trang luon trong tam tay ---- */
@media (max-width: 560px) {
  .wrap { padding: 0 10px 20px; }
  header.book { padding: 18px 0 8px; }
  header.book h1 { font-size: 25px; }
  .toolbar { gap: 6px; }
  .toolbar button { flex: 1 1 auto; min-height: 40px; }
  .sheet { padding: 16px 13px 20px 18px; border-radius: 10px; min-height: 0; }
  .sheet::before { left: 9px; }
  .page-head h2 { font-size: 20px; }
  .ex { padding: 12px; }
  /* 16px de iOS khong tu phong to khi go chu */
  .ex input.answer, textarea.notes { font-size: 16px; }
  .ex .actions button { flex: 1 1 auto; min-height: 40px; }
  button.say { font-size: 19px; padding: 4px 8px; opacity: .6; }
  .tabs button { flex: 1; min-height: 38px; }
  .pager { position: sticky; bottom: 0; background: var(--paper); margin-top: 18px;
    padding: 10px 0; gap: 8px; }
  .pager button { min-height: 42px; flex: 1; }
  .pager .num { flex: none; font-size: 13px; }
  ol.contents li { padding: 12px 0; }
}
@media print {
  body { background: #fff; } .toolbar, .bookmarks, .pager, .tabs, .ex .actions, button.say,
  .toc-fab, .drawer, .subject-tabs { display: none; }
  .sheet { box-shadow: none; min-height: 0; } .ex .feedback { display: block; }
}

</style>
<style>
/* Khoi noi dung cua mon Lap trinh: code, bang du lieu, canh bao, vi du JOIN. */
:root {
  --code-bg: #2f2519; --code-ink: #f2e7d5;
  --hint-bg: #fdf3dc; --hint-edge: #c9a44c;
}
@media (prefers-color-scheme: dark) {
  :root { --code-bg: #14110d; --code-ink: #e8dcc6; --hint-bg: #2c2618; --hint-edge: #8a7433; }
}

code {
  font-family: Consolas, "Cascadia Mono", monospace; font-size: .92em;
  background: var(--accent-soft); color: var(--accent);
  padding: 1px 5px; border-radius: 4px;
}
pre.code {
  background: var(--code-bg); color: var(--code-ink); border-radius: 10px;
  padding: 14px 16px; overflow-x: auto; margin: 12px 0;
  font-family: Consolas, "Cascadia Mono", monospace; font-size: 13.5px; line-height: 1.65;
}
pre.code code { background: none; color: inherit; padding: 0; font-size: inherit; }

aside.hint {
  background: var(--hint-bg); border-left: 4px solid var(--hint-edge);
  padding: 12px 15px; border-radius: 0 8px 8px 0; margin: 14px 0; font-size: 15px;
}
aside.hint code { background: rgba(0, 0, 0, .07); color: inherit; }

.big-example {
  font-size: 25px; font-weight: bold; color: var(--accent);
  text-align: center; margin: 16px 0; letter-spacing: .5px;
}

table.data { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.data th {
  text-align: left; font-size: 12.5px; color: var(--ink-soft);
  background: var(--paper); padding: 8px 11px; border-bottom: 2px solid var(--border);
}
table.data td { padding: 8px 11px; border-bottom: 1px dashed var(--border); }
table.data tr:last-child td { border-bottom: 0; }
.null { color: var(--bad); font-style: italic; }

/* Bai tap dang viet truy van */
textarea.sqlbox {
  width: 100%; margin: 9px 0; padding: 11px 13px; resize: vertical;
  font-family: Consolas, "Cascadia Mono", monospace; font-size: 14px; line-height: 1.6;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--code-bg); color: var(--code-ink);
}
textarea.sqlbox:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
textarea.sqlbox::placeholder { color: var(--code-ink); opacity: .4; }
.want { font-size: 14.5px; color: var(--ink-soft); font-style: italic; margin-top: 5px; }
.solution-hint { margin-top: 6px; font-size: 14.5px; color: var(--ink-soft); }

/* Bang du lieu mau dat o dau trang bai tap */
.dataset { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 14px; background: var(--paper); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px; margin-bottom: 18px; }
.dataset table.data { background: var(--sheet); border-radius: 6px; }

/* Vi du JOIN bam duoc */
.demo { background: var(--paper); border: 1px solid var(--border); border-radius: 10px;
  padding: 15px; margin-bottom: 14px; }
.demo-tables { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.demo-cap { margin: 0 0 6px; font-size: 14px; }
.demo-tables table.data th { background: var(--sheet); }
.demo-tabs { display: flex; gap: 7px; flex-wrap: wrap; margin: 15px 0 4px; }
.demo-tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.demo-note { font-size: 14.5px; color: var(--ink-soft); margin: 8px 0 0; }
#demo-result table.data { margin-top: 10px; background: var(--sheet); border-radius: 8px; }

@media (max-width: 560px) {
  .demo-tables { grid-template-columns: 1fr; }
  .demo-tabs button { flex: 1; min-height: 38px; }
  pre.code { font-size: 12.5px; padding: 12px; }
  .big-example { font-size: 21px; }
}
@media print {
  pre.code { background: #f2efe6; color: #241d13; border: 1px solid #ccc; }
  .demo-tabs { display: none; }
}

</style>
</head>
<body>
<div class="wrap">

  <header class="book">
    <h1>Sổ tay học tập</h1>
    <p>Tiếng Anh và lập trình, làm bài rồi chấm điểm ngay trong sổ</p>
  </header>

  <nav class="subject-tabs" id="subject-tabs"></nav>

  <div class="toolbar">
    <button id="btn-hide-vocab">Ẩn nghĩa (học thẻ)</button>
    <button id="btn-speed">Đọc chậm lại</button>
    <button id="btn-export">Xuất file backup</button>
    <button onclick="document.getElementById('file-import').click()">Nạp lại backup</button>
    <button onclick="window.print()">In ra giấy</button>
    <button id="btn-reset">Xóa hết làm lại</button>
    <input type="file" id="file-import" accept="application/json" hidden>
  </div>

  <div class="score-bar" id="book-top">
    <div class="label">
      <span id="score-text">0 / 0 câu đúng</span>
      <span id="score-pct">0%</span>
    </div>
    <div class="track"><div class="fill" id="score-fill"></div></div>
  </div>

  <button class="toc-fab" id="btn-toc" aria-label="Mở mục lục">☰ Mục lục</button>

  <div class="book-shell">
    <div class="sheet" id="sheet"></div>
    <nav class="bookmarks" id="bookmarks"></nav>
  </div>

  <div class="pager">
    <button id="btn-prev">‹ Trang trước</button>
    <span class="num" id="page-num">Trang 1 / 1</span>
    <button id="btn-next">Trang sau ›</button>
  </div>

</div>

<div class="drawer" id="drawer">
  <div class="drawer-panel">
    <div class="drawer-head">
      <b id="drawer-title">Mục lục</b>
      <button id="drawer-close" aria-label="Đóng mục lục">✕</button>
    </div>
    <nav class="bookmarks" id="drawer-list"></nav>
  </div>
</div>

<script>
// Nội dung 5 chương, rút ra từ các buổi học thực tế trong chat.
window.CHAPTERS = [
  {
    id: "ch1",
    title: "Giới thiệu bản thân",
    subtitle: "Self-introduction",
    intro: "Câu đầu tiên bạn nói với người nước ngoài, với nhà tuyển dụng, với khách hàng. Học thuộc mẫu này.",
    samples: [
      {
        wrong: "Hi my name is Son. I am a Software developer. I want to learn English because i want to earn money, discovery many country in the world.",
        right: "Hi, my name is Son. I'm a software developer. I want to learn English because I want to earn more money and discover many countries in the world.",
        native: "Hi, I'm Son. I work as a software developer. I'm learning English to boost my income and travel the world."
      }
    ],
    rules: [
      { wrong: "Hi my name", right: "Hi, my name", note: "Sau lời chào luôn có dấu phẩy." },
      { wrong: "a Software developer", right: "a software developer", note: "Nghề nghiệp KHÔNG viết hoa trong tiếng Anh, khác tiếng Việt." },
      { wrong: "i want", right: "I want", note: "Chữ I luôn viết hoa ở mọi vị trí, kể cả I'm, I've, I'll." },
      { wrong: "discovery many country", right: "discover many countries", note: "discovery là danh từ, discover mới là động từ. Sau many phải dùng danh từ số nhiều." },
      { wrong: "money, discover", right: "money and discover", note: "Nối 2 hành động bằng and, không dùng dấu phẩy." }
    ]
  },
  {
    id: "ch2",
    title: "Kinh nghiệm & kỹ năng",
    subtitle: "Experience & skills",
    intro: "Phần bạn sẽ dùng nhiều nhất khi phỏng vấn hoặc viết CV. Hai giới từ of và as là chìa khóa.",
    samples: [
      {
        wrong: "I have nearly 4 years experience for software developer. My mainly is ReactJS, NodeJS.",
        right: "I have nearly four years of experience as a software developer. I mainly work with React and Node.js.",
        native: "I've been working as a software developer for almost four years. My main tech stack is React and Node.js."
      }
    ],
    rules: [
      { wrong: "4 years experience", right: "four years of experience", note: "Bắt buộc có of. Số từ 1 đến 10 nên viết bằng chữ trong văn viết." },
      { wrong: "experience for a developer", right: "experience as a developer", note: "as dùng cho vai trò, nghề nghiệp. for nghĩa là cho ai đó." },
      { wrong: "My mainly is React", right: "I mainly work with React", note: "mainly là trạng từ, không thể làm chủ ngữ. Hoặc dùng My main tech stack is React." }
    ]
  },
  {
    id: "ch3",
    title: "Nói về dự án đang làm",
    subtitle: "Talking about your project",
    intro: "Khi ai đó hỏi What are you working on, bạn cần trả lời gọn trong 2 câu. Chú ý trật tự danh từ ghép.",
    samples: [
      {
        wrong: "i'm working on b2b project to give the sale data product, sale can online, check order from customer.",
        right: "I'm working on a B2B project that provides product data to the sales team. Salespeople can sell online and check orders from customers.",
        native: "I'm currently building a B2B platform that gives our sales team access to product data. It lets sales reps sell online and track customer orders in real time."
      }
    ],
    rules: [

<script>
// Luu tru, cham diem va cac ham tien ich dung chung.
window.NB = (function () {
  var KEY = "english-notebook-v1";
  var state = load();

  function subjectIds() {
    return window.SUBJECTS.map(function (s) { return s.id; });
  }

  function blank() {
    var pages = {};
    subjectIds().forEach(function (id) { pages[id] = 0; });
    return {
      answers: {}, status: {}, notes: {},
      hideVocab: false, slowSpeech: false,
      subject: subjectIds()[0], pages: pages
    };
  }

  // Ban backup cu chi co mot so trang duy nhat, va co the thieu mon moi them.
  function normalize(s) {
    if (!s || typeof s !== "object" || !s.answers) return blank();
    var ids = subjectIds();
    if (typeof s.pages !== "object" || !s.pages) {
      s.pages = { en: typeof s.page === "number" ? s.page : 0 };
    }
    ids.forEach(function (id) {
      if (typeof s.pages[id] !== "number") s.pages[id] = 0;
    });
    if (ids.indexOf(s.subject) < 0) s.subject = ids[0];
    delete s.page;
    return s;
  }

  function load() {
    try { return normalize(JSON.parse(localStorage.getItem(KEY))); }
    catch (e) { return blank(); }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { console.warn("Không lưu được:", e); }
  }

  // Cham mem: bo khoang trang thua, dau cau o cuoi, chuan hoa dau nhay cong.
  function norm(s) {
    return String(s).replace(/[‘’]/g, "'").replace(/\s+/g, " ").trim().replace(/[.!?;]+$/, "");
  }
  // Bo het dau cau va viet hoa, dung de phat hien "gan dung".
  function loose(s) {
    return norm(s).toLowerCase().replace(/[.,;:'"?!-]/g, "").replace(/\s+/g, " ").trim();
  }

  // Tu khoa SQL va cac dang dien tu khong phan biet hoa thuong.
  var CASE_FREE = { fill: 1, guess: 1, sql: 1 };

  // Cac dang cham theo thanh phan bat buoc thay vi so tung ky tu:
  // viet truy van SQL va viet code. Nguoi hoc viet kieu nao cung duoc mien la du y.
  var MUST_TYPES = { query: 1, code: 1 };
  function isMustType(ex) { return MUST_TYPES[ex.type] === 1; }

  // Menh de SQL co thu tu co dinh. Du du tu khoa ma dat sai cho thi cau van sai.
  var SQL_ORDER = [
    /\bselect\b/, /\bfrom\b/, /\bjoin\b/, /\bwhere\b/,
    /\bgroup\s+by\b/, /\bhaving\b/, /\border\s+by\b/, /\blimit\b/
  ];
  var ORDER_LABEL = "đúng thứ tự SELECT → FROM → JOIN → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT";

  function clauseOrderOk(s) {
    var last = -1;
    for (var i = 0; i < SQL_ORDER.length; i++) {
      var at = s.search(SQL_ORDER[i]);
      if (at < 0) continue;
      if (at < last) return false;
      last = at;
    }
    return true;
  }

  function missingParts(ex, input) {
    var s = String(input).toLowerCase().replace(/[`]/g, "").replace(/\s+/g, " ").trim();
    var miss = (ex.must || []).filter(function (m) {
      return !new RegExp(m.re, "i").test(s);
    }).map(function (m) { return m.label; });
    // Chi soi thu tu khi da du tu khoa, de khong bao mot luc qua nhieu thu.
    if (ex.type === "query" && miss.length === 0 && !clauseOrderOk(s)) miss.push(ORDER_LABEL);
    return miss;
  }

  function grade(ex, input) {
    if (!norm(input)) return "empty";
    if (isMustType(ex)) {
      return missingParts(ex, input).length === 0 ? "correct" : "wrong";
    }
    var caseFree = CASE_FREE[ex.type] === 1;
    var u = norm(input);
    for (var i = 0; i < ex.answers.length; i++) {
      var a = norm(ex.answers[i]);
      if (caseFree ? a.toLowerCase() === u.toLowerCase() : a === u) return "correct";
    }
    for (var j = 0; j < ex.answers.length; j++) {
      if (loose(ex.answers[j]) === loose(input)) return "close";
    }
    return "wrong";
  }

  function findEx(id) {
    var keys = Object.keys(window.ALL_EXERCISES);
    for (var i = 0; i < keys.length; i++) {
      var list = window.ALL_EXERCISES[keys[i]];
      for (var j = 0; j < list.length; j++) { if (list[j].id === id) return list[j]; }
    }
    return null;
  }

  function chapterIds(subjectId) {
    var ids = [];
    window.SUBJECTS.forEach(function (s) {
      if (subjectId && s.id !== subjectId) return;
      s.chapters.forEach(function (c) { ids.push(c.id); });
    });
    return ids;
  }

  // Dem theo chuong, theo mon, hoac ca so neu khong truyen gi.
  function exercisesOf(scope) {
    if (scope && window.ALL_EXERCISES[scope]) return window.ALL_EXERCISES[scope];
    var out = [];
    chapterIds(scope).forEach(function (id) {
      out = out.concat(window.ALL_EXERCISES[id] || []);
    });
    return out;
  }

  function correctCount(scope) {
    return exercisesOf(scope).filter(function (e) {
      return state.status[e.id] === "correct";
    }).length;
  }

  function totalCount(scope) { return exercisesOf(scope).length; }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  return {
    get: function () { return state; },
    replace: function (s) { state = normalize(s); save(); },
    reset: function () { state = blank(); save(); },
    page: function () { return state.pages[state.subject] || 0; },
    setPage: function (i) { state.pages[state.subject] = i; },
    save: save,
    grade: grade,
    missingParts: missingParts,
    isMustType: isMustType,
    findEx: findEx,
    correctCount: correctCount,
    totalCount: totalCount,
    esc: esc
  };
})();

</script>
<script>
// Doc mau tieng Anh bang Web Speech API co san trong trinh duyet.
// Khong can thu vien, khong can mang, dung giong doc cua he dieu hanh.
window.NBSpeech = (function () {
  var supported = typeof window.speechSynthesis !== "undefined" &&
    typeof window.SpeechSynthesisUtterance !== "undefined";
  var voice = null;

  function pickVoice() {
    if (!supported) return;
    var all = window.speechSynthesis.getVoices() || [];
    var en = all.filter(function (v) { return /^en[-_]/i.test(v.lang); });
    // Uu tien giong My, khong co thi lay giong Anh bat ky.
    voice = en.filter(function (v) { return /^en[-_]US/i.test(v.lang); })[0] || en[0] || null;
  }

  if (supported) {
    pickVoice();
    // Chrome nap danh sach giong bat dong bo nen phai nghe su kien nay.
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }

  function say(text, slow) {
    if (!supported || !text) return false;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = voice ? voice.lang : "en-US";
    u.rate = slow ? 0.6 : 0.95;
    if (voice) u.voice = voice;
    window.speechSynthesis.speak(u);
    return true;
  }

  // Nut loa dat canh mot cum tieng Anh. Tra ve chuoi rong neu trinh duyet khong ho tro.
  function btn(text) {
    if (!supported || !text) return "";
    return '<button class="say" type="button" data-say="' + window.NB.esc(text) +
      '" title="Nghe đọc" aria-label="Nghe đọc">🔊</button>';
  }

  return { supported: supported, say: say, btn: btn };
})();

window.NBDiff = (function () {
  var esc = window.NB.esc;

  function tokenize(s) { return String(s).trim().split(/\s+/).filter(Boolean); }
  // Bo dau cau va viet hoa de so "cung mot tu"
  function key(t) { return String(t).toLowerCase().replace(/[.,!?;:"'’]/g, ""); }

  function editDistance(a, b) {
    var prev = [], cur = [], i, j;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      cur[0] = i;
      for (j = 1; j <= b.length; j++) {
        cur[j] = a[i - 1] === b[j - 1] ? prev[j - 1]
          : 1 + Math.min(prev[j - 1], prev[j], cur[j - 1]);
      }
      prev = cur.slice();
    }
    return prev[b.length];
  }

  // Khop hai chuoi tu bang LCS, tra ve danh sach thao tac theo dung thu tu.
  function align(a, b) {
    var m = a.length, n = b.length, i, j;
    var dp = [];
    for (i = 0; i <= m; i++) {
      dp.push([]);
      for (j = 0; j <= n; j++) dp[i][j] = 0;
    }
    for (i = 1; i <= m; i++) {
      for (j = 1; j <= n; j++) {
        dp[i][j] = key(a[i - 1]) === key(b[j - 1])
          ? dp[i - 1][j - 1] + 1
          : Math.max(dp[i - 1][j], dp[i][j - 1]);
      }
    }
    var ops = [];
    i = m; j = n;
    while (i > 0 && j > 0) {
      if (key(a[i - 1]) === key(b[j - 1])) { ops.unshift({ t: "same", u: a[i - 1], w: b[j - 1] }); i--; j--; }
      else if (dp[i - 1][j] >= dp[i][j - 1]) { ops.unshift({ t: "extra", u: a[i - 1] }); i--; }
      else { ops.unshift({ t: "missing", w: b[j - 1] }); j--; }
    }
    while (i > 0) { ops.unshift({ t: "extra", u: a[i - 1] }); i--; }
    while (j > 0) { ops.unshift({ t: "missing", w: b[j - 1] }); j--; }
    return { ops: ops, lcs: dp[m][n] };
  }

  // Mot tu thua dung canh mot tu thieu thuc chat la mot tu bi viet sai.
  function mergeSubstitutions(ops) {
    var out = [];
    for (var i = 0; i < ops.length; i++) {
      var a = ops[i], b = ops[i + 1];
      if (b && ((a.t === "extra" && b.t === "missing") || (a.t === "missing" && b.t === "extra"))) {
        var u = a.t === "extra" ? a.u : b.u;
        var w = a.t === "missing" ? a.w : b.w;
        out.push({ t: "wrong", u: u, w: w });
        i++;
      } else out.push(a);
    }
    return out;
  }

  // Nhieu tu thieu lien tiep gom thanh mot dau hieu de do roi mat.
  function collapseGaps(ops) {
    var out = [];
    ops.forEach(function (op) {
      var last = out[out.length - 1];
      if (op.t === "missing" && last && last.t === "missing") { last.n = (last.n || 1) + 1; return; }
      out.push(op.t === "missing" ? { t: "missing", w: op.w, n: 1 } : op);
    });
    return out;
  }

  // Bo dau cau dinh o dau va cuoi khi doc ten mot tu trong phan ghi chu.
  function clean(t) { return String(t).replace(/^[^\wÀ-ỹ]+|[^\wÀ-ỹ]+$/g, "") || String(t); }

  // "language" so voi "languages" la loi so it so nhieu, khong phai sai chinh ta.
  function isPluralMix(a, b) {
    var x = key(a), y = key(b);
    return x + "s" === y || y + "s" === x || x + "es" === y || y + "es" === x;
  }

  // Chon dap an gan cau tra loi nhat de so sanh cho cong bang.
  function bestAnswer(answers, input) {
    var u = tokenize(input), best = answers[0], bestScore = -1;
    answers.forEach(function (ans) {
      var w = tokenize(ans);
      var score = (2 * align(u, w).lcs) / (u.length + w.length || 1);
      if (score > bestScore) { bestScore = score; best = ans; }
    });
    return best;
  }

  function classify(op) {
    if (op.t !== "wrong") return op.t;
    if (key(op.u) === key(op.w)) return "case";          // chi khac hoa thuong hoac dau cau
    if (isPluralMix(op.u, op.w)) return "plural";
    if (op.u.length > 3 && editDistance(key(op.u), key(op.w)) <= 2) return "spell";
    return "wrong";
  }

  // Tra ve doan HTML danh dau cau cua nguoi hoc, kem danh sach loi bang tieng Viet.
  // Khong lo ra tu dung, chi noi sai o dau va sai kieu gi.
  function explain(answers, input) {
    var want = bestAnswer(answers, input);
    var ops = collapseGaps(mergeSubstitutions(align(tokenize(input), tokenize(want)).ops));
    var html = "", notes = [];

    function mark(cls, text) { return '<span class="' + cls + '">' + esc(text) + "</span> "; }

    ops.forEach(function (op) {
      if (op.t === "same") {
        if (op.u !== op.w && key(op.u) === key(op.w)) {
          html += mark("d-case", op.u);
          notes.push("<b>" + esc(clean(op.u)) + "</b> sai viết hoa hoặc dấu câu");
        } else html += esc(op.u) + " ";
        return;
      }
      if (op.t === "extra") {
        html += mark("d-extra", op.u);
        notes.push("thừa từ <b>" + esc(clean(op.u)) + "</b>");
        return;
      }
      if (op.t === "missing") {
        html += '<span class="d-gap" title="thiếu từ ở đây">▾</span> ';
        notes.push(op.n > 1 ? "thiếu " + op.n + " từ ở dấu ▾" : "thiếu một từ ở dấu ▾");
        return;
      }
      var kind = classify(op);
      var word = "<b>" + esc(clean(op.u)) + "</b>";
      if (kind === "case") {
        html += mark("d-case", op.u);
        notes.push(word + " sai viết hoa hoặc dấu câu");
      } else if (kind === "plural") {
        html += mark("d-wrong", op.u);
        notes.push(word + " sai số ít hay số nhiều");
      } else if (kind === "spell") {
        html += mark("d-wrong", op.u);
        notes.push(word + " sai chính tả");
      } else {
        html += mark("d-wrong", op.u);
        notes.push(word + " chưa đúng từ");
      }
    });

    // Gop cac loi trung nhau, gioi han cho de khoi roi mat
    var seen = {}, uniq = [];
    notes.forEach(function (n) { if (!seen[n]) { seen[n] = 1; uniq.push(n); } });
    if (uniq.length > 4) uniq = uniq.slice(0, 4).concat(["và vài chỗ nữa"]);

    return { html: html.trim(), notes: uniq };
  }

  return { explain: explain };
})();

</script>

// Dung HTML cho cac khoi noi dung cua mon Lap trinh, va vi du JOIN bam duoc.
window.NBBlocks = (function () {
  var esc = window.NB.esc;

  // Du lieu vi du: S9 khong ton tai trong bang skus de minh hoa dong khong khop.
  var DEMO = {

      text: "Chỉ OI1 khớp S1 nên giữ đúng 1 dòng." },

  function tableHtml(head, rows) {

    head.forEach(function (c) { h += "<th>" + c + "</th>"; });
    h += "</tr></thead><tbody>";
    rows.forEach(function (r) {
      h += "<tr>";
      r.forEach(function (c) { h += "<td>" + c + "</td>"; });
      h += "</tr>";
    });
    return h + "</tbody></table>";
  }

  function demoHtml() {
    return '<div class="demo">' +
      '<div class="demo-tables">' +
      '<div><p class="demo-cap"><b>A · order_items</b></p>' +

      '<div><p class="demo-cap"><b>B · skus</b></p>' +
      tableHtml(["id", "size"], [["S1", "M"], ["S2", "L"]]) + "</div></div>" +
      '<div class="demo-tabs">' +
      '<button data-join="INNER">INNER JOIN</button>' +
      '<button data-join="LEFT">LEFT JOIN</button>' +
      '<button data-join="RIGHT">RIGHT JOIN</button></div>' +
      '<pre class="code"><code id="demo-query"></code></pre>' +
      '<div id="demo-result"></div>' +
      '<p class="demo-note" id="demo-explain"></p></div>';
  }

  function blockHtml(b) {
    if (b.t === "h") return '<h3 class="sub">' + esc(b.text) + "</h3>";
    if (b.t === "p") return "<p>" + b.html + "</p>";
    if (b.t === "code") return '<pre class="code"><code>' + esc(b.text) + "</code></pre>";
    if (b.t === "hint") return '<aside class="hint">' + b.html + "</aside>";
    if (b.t === "big") return '<div class="big-example">' + esc(b.text) + "</div>";
    if (b.t === "table") return '<div class="card">' + tableHtml(b.head, b.rows) + "</div>";
    if (b.t === "demo") return demoHtml();
    return "";
  }

  function render(blocks) {
    return (blocks || []).map(blockHtml).join("");
  }

  // Goi lai sau moi lan ve trang, chi lam gi khi trang do co vi du JOIN.
  function wireDemo(root) {
    var q = root.querySelector("#demo-query");
    if (!q) return;
    var buttons = root.querySelectorAll("[data-join]");

    function show(kind) {
      q.textContent = "SELECT oi.id AS item_id, s.id AS sku_id, s.option2 AS size\n" +
        "FROM order_items oi\n" + kind + ' JOIN skus s ON s.id = oi."skuId";';
      var rows = DEMO[kind].rows.map(function (r) {
        return r.map(function (v) {
          return v === null ? '<span class="null">NULL</span>' : esc(v);
        });
      });
      root.querySelector("#demo-result").innerHTML =
        tableHtml(["item_id", "sku_id", "size"], rows);
      root.querySelector("#demo-explain").textContent = DEMO[kind].text;
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.toggle("on", buttons[i].dataset.join === kind);
      }
    }

    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener("click", function () { show(this.dataset.join); });
    }
    show("INNER");
  }

  return { render: render, wireDemo: wireDemo, table: tableHtml };
})();

<script>
// Dung HTML cho tung trang cua cuon so, dung chung cho ca hai mon.
window.NBRender = (function () {
  var esc = window.NB.esc;
  var say = function (t) { return window.NBSpeech.btn(t); };
  var KIND = {
    translate: "Dịch sang tiếng Anh", fix: "Sửa câu sai", fill: "Điền vào chỗ trống",
    guess: "Đoán kết quả", sql: "Viết mệnh đề SQL", query: "Viết truy vấn",
    code: "Viết code"
  };

  function subjectById(id) {
    return window.SUBJECTS.filter(function (s) { return s.id === id; })[0] || window.SUBJECTS[0];
  }

  // Trang 0 la muc luc, moi chuong chiem 2 trang: bai hoc va bai tap.
  function buildPages(subjectId) {
    var subject = subjectById(subjectId);
    var pages = [{ kind: "toc", subject: subject.id, title: "Mục lục", label: "Mục lục" }];
    subject.chapters.forEach(function (ch, i) {
      pages.push({ kind: "learn", subject: subject.id, chapter: ch.id, title: ch.title, no: i + 1 });
      pages.push({ kind: "practice", subject: subject.id, chapter: ch.id, title: ch.title, no: i + 1 });
    });
    return pages;
  }

  function chapterScore(chId) {
    return window.NB.correctCount(chId) + "/" + window.NB.totalCount(chId);
  }

  function subjectTabsHtml(currentId) {
    return window.SUBJECTS.map(function (s) {
      return '<button class="subject-tab' + (s.id === currentId ? " on" : "") +
        '" data-subject="' + s.id + '">' + esc(s.title) +
        '<small>' + window.NB.correctCount(s.id) + "/" + window.NB.totalCount(s.id) + "</small></button>";
    }).join("");
  }

  function tocHtml(subjectId) {
    var subject = subjectById(subjectId);
    var h = '<div class="page-head"><h2>Mục lục</h2>' +
      '<span class="kicker">' + esc(subject.title) + " · bấm vào chương để mở</span></div>" +
      '<p class="intro">' + esc(subject.tocIntro) + "</p><ol class=\"contents\">";
    subject.chapters.forEach(function (ch, i) {
      h += '<li data-goto="' + (i * 2 + 1) + '"><span class="c-score">' + chapterScore(ch.id) + "</span>" +
        esc(ch.title) + '<span class="c-sub"> — ' + esc(ch.subtitle) + "</span></li>";
    });
    return h + "</ol>";
  }

  function headHtml(ch, label) {
    return '<div class="page-head"><h2>' + esc(ch.title) + "</h2>" +
      '<span class="kicker">' + esc(ch.subtitle) + " · " + label + "</span></div>";
  }

  function tabsHtml(pageIndex, kind) {
    var learn = kind === "learn" ? pageIndex : pageIndex - 1;
    return '<div class="tabs">' +
      '<button data-goto="' + learn + '" class="' + (kind === "learn" ? "on" : "") + '">Bài học</button>' +
      '<button data-goto="' + (learn + 1) + '" class="' + (kind === "practice" ? "on" : "") + '">Bài tập</button>' +
      "</div>";
  }

  // Trang bai hoc mon tieng Anh: cau mau, quy tac, tu vung.
  function learnEnHtml(ch) {
    var st = window.NB.get();
    var h = '<p class="intro">' + esc(ch.intro) + "</p>";

    h += '<h3 class="sub">Câu mẫu</h3>';
    ch.samples.forEach(function (s) {
      h += '<div class="card">' +
        '<div class="line-wrong"><span class="tag">SAI</span>' + esc(s.wrong) + "</div>" +
        '<div class="line-right"><span class="tag">ĐÚNG</span>' + esc(s.right) + say(s.right) + "</div>" +
        '<div class="line-native"><span class="tag">TỰ NHIÊN</span>' + esc(s.native) + say(s.native) + "</div></div>";
    });

    h += '<h3 class="sub">Quy tắc cần thuộc</h3><div class="card">';
    ch.rules.forEach(function (r) {
      h += '<div class="rule"><div class="r-wrong">✗ ' + esc(r.wrong) + "</div>" +
        '<div class="r-right">✓ ' + esc(r.right) + say(r.right) + "</div>" +
        '<div class="r-note">' + esc(r.note) + "</div></div>";
    });
    h += "</div>";

    h += '<h3 class="sub">Từ vựng</h3><div class="card"><table class="vocab">';
    (window.VOCABULARY[ch.id] || []).forEach(function (v) {
      h += '<tr><td class="en">' + esc(v.en) + say(v.en) + "</td>" +
        '<td class="vi' + (st.hideVocab ? " hidden" : "") + '" data-vocab="1">' +
        esc(v.vi) + "</td></tr>";
    });
    return h + "</table></div>";
  }

  // Trang bai hoc mon Lap trinh: cac khoi noi dung tu do.
  function learnBlocksHtml(ch) {
    return '<p class="intro">' + esc(ch.intro) + "</p>" + window.NBBlocks.render(ch.blocks);
  }

  // Dang viet truy van can o nhieu dong, cac dang con lai mot dong la du.
  function fieldHtml(ex, val) {
    if (window.NB.isMustType(ex)) {
      var ph = ex.type === "code" ? "Viết code rồi bấm Kiểm tra..." : "Viết câu lệnh SQL rồi bấm Kiểm tra...";
      return '<textarea class="answer sqlbox" rows="4" spellcheck="false" placeholder="' + ph +
        '" data-id="' + ex.id + '">' +
        esc(val) + "</textarea>";
    }
    return '<input class="answer" type="text" placeholder="Gõ câu trả lời của bạn..." value="' +
      esc(val) + '" data-id="' + ex.id + '">';
  }

  // Bang du lieu mau dung chung cho ca trang bai tap.
  function datasetHtml(ch) {
    if (!ch.dataset) return "";
    var h = '<h3 class="sub">Dữ liệu dùng cho bài tập</h3><div class="dataset">';
    ch.dataset.forEach(function (t) {
      h += '<div><p class="demo-cap"><b>' + esc(t.name) + "</b></p>" +
        window.NBBlocks.table(t.head, t.rows) + "</div>";
    });
    return h + "</div>";
  }

  function exerciseHtml(ex, n) {
    var st = window.NB.get();
    var val = st.answers[ex.id] || "";
    var cls = st.status[ex.id] || "";
    return '<div class="ex ' + cls + '" id="ex-' + ex.id + '">' +
      '<div class="kind">' + KIND[ex.type] + "</div>" +
      '<div class="prompt-vi"><b>Câu ' + n + '.</b> ' + esc(ex.prompt) + '</div>' +
      (ex.want ? '<div class="want">' + esc(ex.want) + '</div>' : '') +
      fieldHtml(ex, val) +
      '<div class="actions">' +
      '<button class="primary" data-act="check" data-id="' + ex.id + '">Kiểm tra</button>' +
      '<button data-act="hint" data-id="' + ex.id + '">Gợi ý</button>' +
      '<button data-act="reveal" data-id="' + ex.id + '">Xem đáp án</button>' +
      '</div><div class="feedback" id="fb-' + ex.id + '"></div></div>';
  }

  function practiceHtml(ch) {
    var st = window.NB.get();
    var list = window.ALL_EXERCISES[ch.id] || [];
    var hasBox = list.some(function (e) { return window.NB.isMustType(e); });
    var keyHint = hasBox ? "Ctrl+Enter" : "Enter";
    var h = '<p class="intro">Gõ đáp án rồi bấm Kiểm tra, hoặc nhấn ' + keyHint +
      ". Chương này bạn đang đúng " +
      '<span id="ch-progress" data-ch="' + ch.id + '">' + chapterScore(ch.id) + "</span> câu.</p>";
    h += datasetHtml(ch);
    list.forEach(function (ex, i) { h += exerciseHtml(ex, i + 1); });
    return h + '<h3 class="sub">Ghi chú của bạn</h3><textarea class="notes" data-notes="' + ch.id +
      '" placeholder="Viết thêm ví dụ, từ mới, hoặc chỗ bạn hay quên...">' +
      esc(st.notes[ch.id] || "") + "</textarea>" +
      '<div class="saved-hint">Tự lưu khi bạn gõ.</div>';
  }

  function pageHtml(pages, i) {
    var p = pages[i];
    if (p.kind === "toc") return tocHtml(p.subject);
    var subject = subjectById(p.subject);
    var ch = subject.chapters.filter(function (c) { return c.id === p.chapter; })[0];
    var head = headHtml(ch, p.kind === "learn" ? "Bài học" : "Bài tập") + tabsHtml(i, p.kind);
    if (p.kind === "practice") return head + practiceHtml(ch);
    return head + (subject.kind === "en" ? learnEnHtml(ch) : learnBlocksHtml(ch));
  }

  function bookmarksHtml(pages, cur) {
    var subject = subjectById(pages[cur].subject);
    var curCh = pages[cur].chapter;
    var h = '<button data-goto="0" class="' + (pages[cur].kind === "toc" ? "on" : "") + '">' +
      '<span class="bm-title">Mục lục</span></button>';
    subject.chapters.forEach(function (ch, i) {
      h += '<button data-goto="' + (i * 2 + 1) + '" class="' + (curCh === ch.id ? "on" : "") + '">' +
        '<span class="bm-title">' + (i + 1) + ". " + esc(ch.title) + "</span>" +
        '<span class="bm-sub">' + chapterScore(ch.id) + " câu đúng</span></button>";
    });
    return h;
  }

  return {
    buildPages: buildPages, pageHtml: pageHtml, bookmarksHtml: bookmarksHtml,
    chapterScore: chapterScore, subjectTabsHtml: subjectTabsHtml, subjectById: subjectById
  };
})();

</script>
<script>
// Dieu khien cuon so: doi mon, lat trang, cham diem, luu tru.
(function () {
  var NB = window.NB, R = window.NBRender;
  var PAGES = R.buildPages(NB.get().subject);
  var say = function (t) { return window.NBSpeech.btn(t); };
  var el = {
    sheet: document.getElementById("sheet"),
    marks: document.getElementById("bookmarks"),
    subjectTabs: document.getElementById("subject-tabs"),
    drawer: document.getElementById("drawer"),
    drawerList: document.getElementById("drawer-list"),
    drawerTitle: document.getElementById("drawer-title"),
    num: document.getElementById("page-num"),
    prev: document.getElementById("btn-prev"),
    next: document.getElementById("btn-next"),
    scoreText: document.getElementById("score-text"),
    scorePct: document.getElementById("score-pct"),
    scoreFill: document.getElementById("score-fill")
  };

  function clampPage(i) { return Math.max(0, Math.min(PAGES.length - 1, i)); }

  function refreshScore() {
    var subject = R.subjectById(NB.get().subject);
    var done = NB.correctCount(subject.id), all = NB.totalCount(subject.id);
    el.scoreText.textContent = subject.title + ": " + done + " / " + all + " câu đúng";
    el.scorePct.textContent = Math.round((done / all) * 100) + "%";
    el.scoreFill.style.width = (done / all) * 100 + "%";
  }

  function refreshNav() {
    el.marks.innerHTML = R.bookmarksHtml(PAGES, NB.page());
    el.drawerList.innerHTML = el.marks.innerHTML;
    el.subjectTabs.innerHTML = R.subjectTabsHtml(NB.get().subject);
  }

  // Cap nhat diem tong, danh sach chuong va dong diem cua chuong dang mo.
  function refreshCounters() {
    refreshScore();
    refreshNav();
    var chp = document.getElementById("ch-progress");
    if (chp) chp.textContent = R.chapterScore(chp.dataset.ch);
  }

  // Dap an nao da co dau cau o cuoi thi khong cong them dau cham nua.
  function answerText(s) {
    return NB.esc(s) + (/[.;!?]$/.test(String(s).trim()) ? " " : ". ");
  }

  // Danh dau tung tu sai trong cau nguoi hoc vua viet, kem danh sach loi cu the.
  function diffBlock(ex, id) {
    var val = NB.get().answers[id] || "";
    if (!val.trim()) return "";
    var d = window.NBDiff.explain(ex.answers, val);
    if (!d.notes.length) return "";
    return '<div class="diff">' + d.html + "</div>" +
      '<ul class="diff-notes"><li>' + d.notes.join("</li><li>") + "</li></ul>";
  }

  function showFeedback(id, kind) {
    var ex = NB.findEx(id);
    var fb = document.getElementById("fb-" + id);
    var box = document.getElementById("ex-" + id);
    if (!fb || !box || !ex) return;
    var readable = ex.type === "translate" || ex.type === "fix";
    box.classList.remove("correct", "close", "wrong");
    fb.classList.add("show");
    if (kind === "correct") {
      box.classList.add("correct");
      fb.innerHTML = '<span class="fb-ok">✓ Chính xác!</span> ' + (readable ? say(ex.answers[0]) : "");
    } else if (kind === "close") {
      box.classList.add("close");
      fb.innerHTML = '<span class="fb-warn">⚠ Gần đúng.</span> Từ ngữ đúng rồi, chỉ vướng mấy chỗ này:' +
        diffBlock(ex, id) +
        '<div class="solution">Đáp án: ' + answerText(ex.answers[0]) +
        (readable ? say(ex.answers[0]) : "") + "</div>";
    } else if (kind === "reveal") {
      box.classList.add("close");
      fb.innerHTML = '<span class="fb-warn">Đáp án:</span> ' + answerText(ex.answers[0]) +
        (readable ? say(ex.answers[0]) : "") +
        (ex.answers.length > 1 ? '<div class="solution">Cách khác: ' + NB.esc(ex.answers[1]) + ".</div>" : "");
    } else if (kind === "hint") {
      fb.innerHTML = '<span class="fb-warn">Gợi ý:</span> ' + NB.esc(ex.hint);
    } else if (kind === "empty") {
      fb.innerHTML = '<span class="fb-bad">Bạn chưa viết gì cả.</span>';
    } else if (NB.isMustType(ex)) {
      // Chi ra thanh phan con thieu thay vi chi bao sai.
      box.classList.add("wrong");
      var miss = NB.missingParts(ex, document.querySelector('.answer[data-id="' + id + '"]').value);
      fb.innerHTML = '<span class="fb-bad">✗ Còn thiếu:</span> ' +
        miss.map(function (m) { return "<code>" + NB.esc(m) + "</code>"; }).join(", ") +
        '<div class="solution-hint">Gợi ý: ' + NB.esc(ex.hint) + "</div>";
    } else {
      box.classList.add("wrong");
      fb.innerHTML = '<span class="fb-bad">✗ Chưa đúng.</span> Soi lại mấy chỗ được đánh dấu:' +
        diffBlock(ex, id) +
        '<div class="solution-hint">Gợi ý: ' + NB.esc(ex.hint) + "</div>";
    }
  }

  function render(animate) {
    var st = NB.get();
    NB.setPage(clampPage(NB.page()));
    el.sheet.innerHTML = R.pageHtml(PAGES, NB.page());
    window.NBBlocks.wireDemo(el.sheet);
    refreshNav();
    el.num.textContent = "Trang " + (NB.page() + 1) + " / " + PAGES.length;
    el.prev.disabled = NB.page() === 0;
    el.next.disabled = NB.page() === PAGES.length - 1;
    Object.keys(st.status).forEach(function (id) { showFeedback(id, st.status[id]); });
    refreshScore();
    if (animate) {
      el.sheet.classList.remove("flip");
      void el.sheet.offsetWidth;
      el.sheet.classList.add("flip");
    }
  }

  function closeDrawer() { el.drawer.classList.remove("open"); }

  function goTo(i) {
    i = clampPage(i);
    closeDrawer();
    if (i === NB.page()) return;
    NB.setPage(i); NB.save(); render(true);
    document.getElementById("book-top").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function switchSubject(id) {
    var st = NB.get();
    closeDrawer();
    if (st.subject === id) return;
    st.subject = id; NB.save();
    PAGES = R.buildPages(id);
    render(true);
    document.getElementById("book-top").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest
      ? e.target.closest("[data-say],[data-subject],[data-goto],[data-act],[data-vocab]") : null;
    if (!t) return;
    if (t.dataset.say !== undefined) { window.NBSpeech.say(t.dataset.say, NB.get().slowSpeech); return; }
    if (t.dataset.subject !== undefined) { switchSubject(t.dataset.subject); return; }
    if (t.dataset.goto !== undefined) { goTo(parseInt(t.dataset.goto, 10)); return; }
    if (t.dataset.vocab) { t.classList.toggle("hidden"); return; }

    var st = NB.get(), id = t.dataset.id, act = t.dataset.act;
    if (act === "hint") { showFeedback(id, "hint"); return; }
    if (act === "reveal") {
      st.status[id] = "close"; NB.save();
      showFeedback(id, "reveal"); refreshCounters();
      return;
    }
    var input = document.querySelector('.answer[data-id="' + id + '"]');
    var res = NB.grade(NB.findEx(id), input.value);
    st.answers[id] = input.value;
    if (res !== "empty") st.status[id] = res;
    NB.save(); showFeedback(id, res); refreshCounters();
  });

  document.addEventListener("input", function (e) {
    var t = e.target, st = NB.get();
    if (t.classList.contains("answer")) { st.answers[t.dataset.id] = t.value; NB.save(); }
    if (t.dataset && t.dataset.notes) { st.notes[t.dataset.notes] = t.value; NB.save(); }
  });

  document.addEventListener("keydown", function (e) {
    var typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
    var multiline = e.target.tagName === "TEXTAREA";
    if (e.key === "Enter" && typing && e.target.classList.contains("answer") && (!multiline || e.ctrlKey)) {
      document.querySelector('button[data-act="check"][data-id="' + e.target.dataset.id + '"]').click();
      return;
    }
    if (e.key === "Escape") closeDrawer();
    if (typing) return;
    if (e.key === "ArrowRight") goTo(NB.page() + 1);
    if (e.key === "ArrowLeft") goTo(NB.page() - 1);
  });

  el.prev.addEventListener("click", function () { goTo(NB.page() - 1); });
  el.next.addEventListener("click", function () { goTo(NB.page() + 1); });

  document.getElementById("btn-toc").addEventListener("click", function () {
    el.drawerTitle.textContent = R.subjectById(NB.get().subject).title;
    el.drawer.classList.add("open");
  });
  document.getElementById("drawer-close").addEventListener("click", closeDrawer);
  el.drawer.addEventListener("click", function (e) {
    if (e.target === el.drawer) closeDrawer();
  });

  // Thanh cong cu nam o notebook-toolbar.js, nap sau file nay.
  window.NBApp = {
    render: render,
    rebuild: function () { PAGES = R.buildPages(NB.get().subject); render(true); }
  };

  if (NB.get().hideVocab) {
    document.getElementById("btn-hide-vocab").textContent = "Hiện nghĩa từ vựng";
  }
  render(false);
})();

</script>
<script>
// Thanh cong cu: an nghia, toc doc, xoa het, xuat va nap backup.
(function () {
  var NB = window.NB, App = window.NBApp;

  document.getElementById("btn-hide-vocab").addEventListener("click", function () {
    var st = NB.get();
    st.hideVocab = !st.hideVocab; NB.save();
    var cells = document.querySelectorAll("td.vi");
    for (var i = 0; i < cells.length; i++) cells[i].classList.toggle("hidden", st.hideVocab);
    this.textContent = st.hideVocab ? "Hiện nghĩa từ vựng" : "Ẩn nghĩa (học thẻ)";
  });

  var btnSpeed = document.getElementById("btn-speed");
  if (!window.NBSpeech.supported) {
    btnSpeed.textContent = "Trình duyệt không đọc được";
    btnSpeed.disabled = true;
  } else {
    btnSpeed.addEventListener("click", function () {
      var st = NB.get();
      st.slowSpeech = !st.slowSpeech; NB.save();
      this.textContent = st.slowSpeech ? "Đang đọc chậm ✓" : "Đọc chậm lại";
      window.NBSpeech.say("This is the reading speed.", st.slowSpeech);
    });
    if (NB.get().slowSpeech) btnSpeed.textContent = "Đang đọc chậm ✓";
  }

  document.getElementById("btn-reset").addEventListener("click", function () {
    if (confirm("Xóa toàn bộ bài làm và ghi chú? Không khôi phục được.")) {
      NB.reset(); App.rebuild();
    }
  });

  document.getElementById("btn-export").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(NB.get(), null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "english-notebook-backup.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  document.getElementById("file-import").addEventListener("change", function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        NB.replace(JSON.parse(r.result));
        App.rebuild();
        alert("Đã nạp lại bài làm.");
      } catch (err) { alert("File không hợp lệ."); }
    };
    r.readAsText(f);
  });

})();

</script>
</body>
